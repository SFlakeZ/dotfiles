# TPM: https://github.com/tmux-plugins/tpm
set -g @plugin "tmux-plugins/tpm"

# Catppuccin: https://github.com/catppuccin/tmux
set -g @plugin "catppuccin/tmux#v2.3.2"

# FloaX: https://github.com/omerxx/tmux-floax
set -g @plugin "omerxx/tmux-floax"

set -g @floax-border-color "blue"
set -g @floax-title " scratch "
set -g @floax-text-color "white"

# vim-tmux-navigator: https://github.com/christoomey/vim-tmux-navigator
set -g @plugin "christoomey/vim-tmux-navigator"

# tmux-resurrect & tmux-continuum: https://github.com/tmux-plugins/tmux-resurrect
# https://github.com/tmux-plugins/tmux-continuum
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @continuum-restore "on"

# tmux-yank: https://github.com/tmux-plugins/tmux-yank
set -g @plugin "tmux-plugins/tmux-yank"

# Plugin configurations
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

# status line
set -g status-position top

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-left "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator "no"
