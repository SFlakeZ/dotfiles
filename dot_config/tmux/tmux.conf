# General
set -g prefix ^B
set -g mouse on
set -g default-terminal "tmux-256color"

set -g base-index 1         # windows start at index 1
set -g pane-base-index 1    # panes start at index 1
set -g renumber-windows on
set -g set-clipboard on

set -g history-limit 4000

# Neovim compatibility
set -sg escape-time 10
set -g focus-events on

# set -g monitor-activity on
# set -g visual-activity on

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set-window-option -g mode-keys vi

# Reload config
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"

# Splits & windows open in the current pane's path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# TPM bootstrap
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

if-shell "[ ! -d ~/.local/share/tmux/plugins/tpm ]" \
  "run-shell '
    git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm &&
    ~/.local/share/tmux/plugins/tpm/bin/install_plugins
  '"

# Plugins
source-file "~/.config/tmux/plugins.conf"

# Initialize plugin manager
run "~/.local/share/tmux/plugins/tpm/tpm"

